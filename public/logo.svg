<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Shutter Icon Badge -->
  <rect x="6" y="6" width="48" height="48" rx="14" fill="url(#amber-grad)" />
  <!-- Camera body outline -->
  <rect x="15" y="19" width="30" height="24" rx="5" stroke="#090a0f" stroke-width="2.5" />
  <path d="M24 19L26 15H34L36 19" stroke="#090a0f" stroke-width="2.5" stroke-linecap="round" />
  <!-- Iris Circle & Blades -->
  <circle cx="30" cy="31" r="7" stroke="#090a0f" stroke-width="2" />
  <circle cx="30" cy="31" r="2.5" fill="#090a0f" />
  <!-- Text FOTOTIME -->
  <text x="66" y="39" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="-0.5">
    FOTO<tspan fill="#f59e0b">TIME</tspan>
  </text>
  <!-- MX Badge -->
  <rect x="194" y="22" width="28" height="16" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
  <text x="208" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="9" fill="#f59e0b" text-anchor="middle" letter-spacing="1">
    MX
  </text>
  <defs>
    <linearGradient id="amber-grad" x1="6" y1="6" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
  </defs>
</svg>
